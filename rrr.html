    let vehicles = "bike";

    switch (vehicles) {

        break;

        break;
      case "bus":
        console.log("You have a bus");
        break;
      default:
        console.log("You have no vehicle");
    }

    let car = "5"

    if (car === "5" && bike === "2") {

      console.log("You have different number of vehicles");
    }
  </script>
